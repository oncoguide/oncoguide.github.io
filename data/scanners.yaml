# ════════════════════════════════════════════════════════════════════
# scanners.yaml — single source of truth for the imaging-equipment guide.
# Rendered by layouts/shortcodes/scanner-rank.html into ranked cards.
# Language-neutral: numbers/models/centers live here once → all 6 languages.
#
# RULES (see plan atomic-toasting-mist.md):
#  - Ranked by PERFORMANCE only (detector gen → dose → FOV/field → AI). Cost never ranks.
#  - One card per distinct model; identical models across centers merge (multiple `centers`).
#  - A machine may sit in several regions; each center carries its own `region` (ro|intl).
#  - rank_ro / rank_intl / rank_combined: only on confirmed machines.
#  - confirmed:false → routed to a separate "not independently verified" list (no rank, no bars).
#  - Two data points shown per card: radiation (dose_value, mSv) + the modality's headline quality metric.
#  - AI label (ai: true) ONLY for genuine deep-learning / AI features (source-verified). Classical
#    iterative recon (Q.Clear/BSREM, QIR, ADMIRE, ASiR, SAFIRE) is NOT AI and gets no label.
#  - Cost = public framing only; no contact-specific / personal quotes.
# ════════════════════════════════════════════════════════════════════

