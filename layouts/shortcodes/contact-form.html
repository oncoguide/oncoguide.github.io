{{- /* Contact form → emails the OncoGuide address via Web3Forms (reliable, no backend
       needed for a static site; the email stays OUT of the page source — only a public
       access key is used). Set the key in hugo.yaml params.web3formsKey (free at web3forms.com).
       Labels localized via i18n. */ -}}
<form class="onco-contact-form" action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="{{ site.Params.web3formsKey }}">
  <input type="hidden" name="subject" value="OncoGuide — contact form">
  <input type="hidden" name="from_name" value="OncoGuide">
  <input type="hidden" name="redirect" value="https://oncoguide.github.io/">
  <input type="checkbox" name="botcheck" class="onco-cf-honey" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="onco-cf-field">
    <span>{{ i18n "contactFormName" }}</span>
    <input type="text" name="name" required>
  </label>
  <label class="onco-cf-field">
    <span>{{ i18n "contactFormEmail" }}</span>
    <input type="email" name="email" required>
  </label>
  <label class="onco-cf-field">
    <span>{{ i18n "contactFormMessage" }}</span>
    <textarea name="message" rows="6" required></textarea>
  </label>
  <button type="submit" class="onco-cf-submit">{{ i18n "contactFormSend" }}</button>
</form>
